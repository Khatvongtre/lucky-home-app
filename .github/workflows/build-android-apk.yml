name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - apk/**

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK downloads
    runs-on: windows-latest
    env:
      VITE_APP_BUILD_NUMBER: ${{ github.run_number }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set build metadata
        shell: pwsh
        run: |
          $buildDate = (Get-Date).ToUniversalTime().ToString('o')
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "VITE_APP_BUILD_DATE=$buildDate"

      - name: Install dependencies
        run: npm ci

      - name: Validate release signing secrets
        shell: pwsh
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace('${{ secrets.ANDROID_KEYSTORE_BASE64 }}')) { $missing += 'ANDROID_KEYSTORE_BASE64' }
          if ([string]::IsNullOrWhiteSpace('${{ secrets.ANDROID_KEYSTORE_PASSWORD }}')) { $missing += 'ANDROID_KEYSTORE_PASSWORD' }
          if ([string]::IsNullOrWhiteSpace('${{ secrets.ANDROID_KEY_ALIAS }}')) { $missing += 'ANDROID_KEY_ALIAS' }
          if ([string]::IsNullOrWhiteSpace('${{ secrets.ANDROID_KEY_PASSWORD }}')) { $missing += 'ANDROID_KEY_PASSWORD' }
          if ($missing.Count -gt 0) {
            throw "Missing GitHub secrets for Android release signing: $($missing -join ', ')."
          }

      - name: Prepare release keystore
        shell: pwsh
        run: |
          $keystorePath = Join-Path $PWD 'android/release.keystore'
          [System.IO.File]::WriteAllBytes($keystorePath, [Convert]::FromBase64String('${{ secrets.ANDROID_KEYSTORE_BASE64 }}'))
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ANDROID_KEYSTORE_FILE=$keystorePath"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Build Lucky Home APK
        shell: pwsh
        run: |
          npm run android:apk:home
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Copy Lucky Home APK
        shell: pwsh
        run: |
          $apkPath = 'android/app/build/outputs/apk/release/app-release.apk'
          if (!(Test-Path -LiteralPath $apkPath)) {
            throw "Lucky Home APK was not created at $apkPath."
          }
          Copy-Item -LiteralPath $apkPath -Destination apk/lucky-home.apk -Force

      - name: Update APK manifest
        shell: pwsh
        run: |
          $manifest = [ordered]@{
            schemaVersion = 1
            generatedAt = $env:VITE_APP_BUILD_DATE
            buildNumber = [int]$env:VITE_APP_BUILD_NUMBER
            variants = [ordered]@{
              home = [ordered]@{
                label = 'Lucky Home'
                apkName = 'lucky-home.apk'
                downloadUrl = 'https://raw.githubusercontent.com/Khatvongtre/lucky-home-app/main/apk/lucky-home.apk'
              }
            }
          }
          $json = $manifest | ConvertTo-Json -Depth 6
          [System.IO.File]::WriteAllText((Join-Path $PWD 'apk/update.json'), $json, [System.Text.UTF8Encoding]::new($false))

      - name: Upload Lucky Home APK
        uses: actions/upload-artifact@v4
        with:
          name: lucky-home.apk
          path: apk/lucky-home.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK downloads
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apk/lucky-home.apk apk/update.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'APK downloads already match this build.'
            exit 0
          }
          git commit -m 'chore: update Android APK downloads [skip ci]'
          git push
